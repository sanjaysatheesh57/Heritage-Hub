<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .title { font-family: 'Georgia', serif; font-size: 44px; fill: #D97706; font-weight: bold; }
      .entity-text { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .process-title { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .process-sub { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #000000; text-anchor: middle; }
      .datastore-text { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 500; fill: #000000; text-anchor: middle; }
      .flow-text { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #1c1917; text-anchor: middle; }
      .flow-text-right { font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #1c1917; text-anchor: end; }
      .shape-border { stroke: #000000; stroke-width: 1.8; fill: #ffffff; }
      .arrow-line { stroke: #000000; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Slide Background -->
  <rect width="1920" height="1080" fill="#ffffff" />

  <!-- Top-Right Organic Slide Decoration (Matching Reference PPT Slide) -->
  <path d="M 1380 0 Q 1480 320, 1920 180 L 1920 0 Z" fill="#F59E0B" opacity="0.9" />
  <path d="M 1480 0 Q 1580 260, 1920 140 L 1920 0 Z" fill="#FBBF24" />

  <!-- Bottom-Left Organic Slide Decoration -->
  <path d="M 0 920 Q 220 900, 140 1080 L 0 1080 Z" fill="#F59E0B" opacity="0.85" />

  <!-- Slide Title -->
  <text x="960" y="85" class="title" text-anchor="middle">DFD – Level 1</text>

  <!-- ======================================================== -->
  <!-- 1. TOP DATA STORE: auth_user (Gane & Sarson open-ended)  -->
  <!-- ======================================================== -->
  <g id="datastore-top">
    <!-- Top line -->
    <line x1="310" y1="165" x2="550" y2="165" stroke="#000" stroke-width="1.8" />
    <!-- Bottom line -->
    <line x1="310" y1="235" x2="550" y2="235" stroke="#000" stroke-width="1.8" />
    <!-- Left vertical line -->
    <line x1="310" y1="165" x2="310" y2="235" stroke="#000" stroke-width="1.8" />
    <!-- Inner divider line -->
    <line x1="355" y1="165" x2="355" y2="235" stroke="#000" stroke-width="1.8" />
    <!-- Text -->
    <text x="452" y="206" class="datastore-text">auth_user</text>
  </g>

  <!-- ======================================================== -->
  <!-- 2. REGISTRATION PROCESS (Oval)                           -->
  <!-- ======================================================== -->
  <g id="process-registration">
    <ellipse cx="430" cy="370" rx="100" ry="50" class="shape-border" />
    <text x="430" y="377" class="process-title">Registration</text>
  </g>

  <!-- ======================================================== -->
  <!-- 3. USER ENTITY (Rectangle on left)                       -->
  <!-- ======================================================== -->
  <g id="entity-user">
    <rect x="130" y="555" width="180" height="90" class="shape-border" />
    <text x="220" y="608" class="entity-text">User</text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. CENTRAL AUTHENTICATION PROCESS (Large Oval)           -->
  <!-- ======================================================== -->
  <g id="process-authentication">
    <ellipse cx="780" cy="600" rx="145" ry="60" class="shape-border" />
    <text x="780" y="607" class="process-title">Authentication</text>
  </g>

  <!-- ======================================================== -->
  <!-- 5. BOTTOM DATA STORE: django_session                     -->
  <!-- ======================================================== -->
  <g id="datastore-bottom">
    <!-- Top line -->
    <line x1="660" y1="785" x2="900" y2="785" stroke="#000" stroke-width="1.8" />
    <!-- Bottom line -->
    <line x1="660" y1="855" x2="900" y2="855" stroke="#000" stroke-width="1.8" />
    <!-- Left vertical line -->
    <line x1="660" y1="785" x2="660" y2="855" stroke="#000" stroke-width="1.8" />
    <!-- Inner divider line -->
    <line x1="705" y1="785" x2="705" y2="855" stroke="#000" stroke-width="1.8" />
    <!-- Text -->
    <text x="802" y="826" class="datastore-text">django_session</text>
  </g>

  <!-- ======================================================== -->
  <!-- ARROWS ON LEFT & CENTER                                  -->
  <!-- ======================================================== -->
  <!-- Arrow: User -> Registration -->
  <line x1="260" y1="555" x2="365" y2="415" class="arrow-line" />
  <text x="290" y="475" class="flow-text" transform="rotate(-52 290 475)">new user</text>

  <!-- Dual Arrows: Registration <-> auth_user Data Store -->
  <line x1="410" y1="320" x2="410" y2="243" class="arrow-line" />
  <line x1="450" y1="243" x2="450" y2="320" class="arrow-line" />
  <text x="395" y="285" class="flow-text-right">details</text>

  <!-- Arrow: Registration -> Authentication -->
  <line x1="505" y1="405" x2="695" y2="550" class="arrow-line" />
  <text x="615" y="465" class="flow-text">Username</text>
  <text x="615" y="485" class="flow-text">Password</text>

  <!-- Arrow: User -> Authentication -->
  <line x1="310" y1="600" x2="635" y2="600" class="arrow-line" />
  <text x="470" y="575" class="flow-text">Username</text>
  <text x="470" y="595" class="flow-text">Password</text>

  <!-- Dual Arrows: Authentication <-> django_session Data Store -->
  <line x1="760" y1="660" x2="760" y2="777" class="arrow-line" />
  <line x1="800" y1="777" x2="800" y2="660" class="arrow-line" />
  <text x="745" y="725" class="flow-text-right">Details</text>

  <!-- ======================================================== -->
  <!-- 6. RIGHT SIDE: 5 ROLE PROCESSES & 5 EXTERNAL ENTITIES     -->
  <!-- ======================================================== -->

  <!-- ROW 1: Admin Process 1:1 -> Admin -->
  <g id="row-admin">
    <ellipse cx="1270" cy="245" rx="110" ry="42" class="shape-border" />
    <text x="1270" y="240" class="process-title">Admin Process</text>
    <text x="1270" y="262" class="process-sub">1:1</text>

    <line x1="1380" y1="245" x2="1600" y2="245" class="arrow-line" />

    <rect x="1600" y="205" width="180" height="80" class="shape-border" />
    <text x="1690" y="252" class="entity-text">Admin</text>

    <!-- Branch from Auth to Admin Process -->
    <line x1="875" y1="550" x2="1170" y2="260" class="arrow-line" />
  </g>

  <!-- ROW 2: Trustee Process 1:2 -> Trustee -->
  <g id="row-trustee">
    <ellipse cx="1270" cy="420" rx="110" ry="42" class="shape-border" />
    <text x="1270" y="415" class="process-title">Trustee Process</text>
    <text x="1270" y="437" class="process-sub">1:2</text>

    <line x1="1380" y1="420" x2="1600" y2="420" class="arrow-line" />

    <rect x="1600" y="380" width="180" height="80" class="shape-border" />
    <text x="1690" y="427" class="entity-text">Trustee</text>

    <!-- Branch from Auth to Trustee Process -->
    <line x1="905" y1="575" x2="1165" y2="435" class="arrow-line" />
  </g>

  <!-- ROW 3: Officer Process 1:3 -> Government Officer -->
  <g id="row-officer">
    <ellipse cx="1270" cy="600" rx="110" ry="42" class="shape-border" />
    <text x="1270" y="595" class="process-title">Officer Process</text>
    <text x="1270" y="617" class="process-sub">1:3</text>

    <line x1="1380" y1="600" x2="1600" y2="600" class="arrow-line" />

    <rect x="1600" y="555" width="180" height="90" class="shape-border" />
    <text x="1690" y="597" class="entity-text">Government</text>
    <text x="1690" y="621" class="entity-text">Officer</text>

    <!-- Branch from Auth to Officer Process (Horizontal) -->
    <line x1="925" y1="600" x2="1160" y2="600" class="arrow-line" />
  </g>

  <!-- ROW 4: Staff Process 1:4 -> Staff -->
  <g id="row-staff">
    <ellipse cx="1270" cy="775" rx="110" ry="42" class="shape-border" />
    <text x="1270" y="770" class="process-title">Staff Process</text>
    <text x="1270" y="792" class="process-sub">1:4</text>

    <line x1="1380" y1="775" x2="1600" y2="775" class="arrow-line" />

    <rect x="1600" y="735" width="180" height="80" class="shape-border" />
    <text x="1690" y="782" class="entity-text">Staff</text>

    <!-- Branch from Auth to Staff Process -->
    <line x1="905" y1="625" x2="1165" y2="760" class="arrow-line" />
  </g>

  <!-- ROW 5: Devotee Process 1:5 -> Devotee -->
  <g id="row-devotee">
    <ellipse cx="1270" cy="940" rx="110" ry="42" class="shape-border" />
    <text x="1270" y="935" class="process-title">Devotee Process</text>
    <text x="1270" y="957" class="process-sub">1:5</text>

    <line x1="1380" y1="940" x2="1600" y2="940" class="arrow-line" />

    <rect x="1600" y="900" width="180" height="80" class="shape-border" />
    <text x="1690" y="947" class="entity-text">Devotee</text>

    <!-- Branch from Auth to Devotee Process -->
    <line x1="875" y1="650" x2="1170" y2="925" class="arrow-line" />
  </g>

  <!-- Slide Footer Number -->
  <text x="1840" y="1030" font-family="'Calibri', sans-serif" font-size="18" fill="#888888">28</text>
</svg>
